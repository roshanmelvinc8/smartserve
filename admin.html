<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SmartServe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1d2671, #c33764);
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            border-radius: 20px;
        }

        .token {
            font-size: 2.5rem;
            font-weight: bold;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 20px !important;
            }

            h2 {
                font-size: 1.5rem;
            }

            .token {
                font-size: 1.8rem;
            }

            .col-md-4 {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }

        @media (max-width: 480px) {
            h2 {
                font-size: 1.2rem;
                margin-bottom: 1.5rem !important;
            }

            .card {
                padding: 15px !important;
            }

            .token {
                font-size: 1.5rem;
            }

            button {
                font-size: 0.9rem;
                padding: 0.6rem 1.2rem !important;
            }

            .bg-primary, .bg-secondary, .bg-success {
                padding: 15px !important;
            }
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow p-4 col-md-10 col-lg-8 text-center">

            <h2 class="mb-4">Admin Token Display</h2>

            <div class="row g-4">

                <div class="col-md-4">
                    <div class="bg-primary text-white p-3 rounded">
                        Bonafide
                        <div class="token" id="b">—</div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="bg-secondary text-white p-3 rounded">
                        Transfer
                        <div class="token" id="t">—</div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="bg-success text-white p-3 rounded">
                        Fee Enquiry
                        <div class="token" id="f">—</div>
                    </div>
                </div>

            </div>

            <hr class="my-4">

            <button class="btn btn-danger btn-lg" onclick="resetTokens()">
                Reset All Tokens
            </button>

        </div>
    </div>

    <script>
        function loadTokens() {
            document.getElementById("b").innerText =
                localStorage.getItem("Bonafide_current") || "—";

            document.getElementById("t").innerText =
                localStorage.getItem("Transfer_current") || "—";

            document.getElementById("f").innerText =
                localStorage.getItem("Fee_current") || "—";
        }

        function resetTokens() {
            localStorage.clear();
            alert("All tokens reset");
            loadTokens();
        }

        loadTokens();
        setInterval(loadTokens, 2000);
    </script>

</body>

</html>
