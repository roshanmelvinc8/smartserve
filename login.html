<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartServe - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">
    <h2>SmartServe</h2>
    <p class="subtitle"><b>College Office Token & Queue Management</b></p>

    <form id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="userId" placeholder="Enter your email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit">Login</button>

        <p class="forgot">Forgot Password?</p>
    </form>

    <p style="margin-top: 20px; font-size: 12px; color: #666;">
        <b>Demo Credentials:</b><br>
        Student: student@college.edu / studentpass<br>
        Staff: staff@college.edu / staffpass<br>
        Admin: admin@college.edu / adminpass
    </p>
</div>

<script src="login.js"></script>

</body>
</html>
