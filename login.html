<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Queue Management - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">
    <h2>Queue Management System</h2>
    <p class="subtitle"><b>College Office Token Queue</b></p>

    <form id="loginForm">
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="userId" placeholder="Enter your username" required>
        </div>

        <div class="input-group">
            <label>User ID</label>
            <input type="text" id="password" placeholder="Enter your ID" required>
        </div>

        <div class="role-group">
            <label>Login As</label>
            <select id="role" required>
                <option value="">Select Role</option>
                <option value="student">Student</option>
                <option value="staff">Staff</option>
                <option value="admin">Admin</option>
            </select>
        </div>

        <button type="submit">Login</button>
    </form>
</div>

<script src="login.js"></script>

</body>
</html>
