<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Selection - SmartServe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
        }

        .card {
            border-radius: 20px;
        }
        
        .navbar-custom {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            margin-bottom: 2rem;
        }
        
        .navbar-custom .btn-logout {
            background-color: #ff6b6b;
            color: white;
            border: none;
        }
        
        .navbar-custom .btn-logout:hover {
            background-color: #ff4757;
            color: white;
        }
    </style>
</head>

<body>

    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h4 style="color: white; margin: 0;">SmartServe - Service Portal</h4>
        <button class="btn btn-logout btn-sm" onclick="logout()">Logout</button>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow text-center col-md-6 col-lg-4">

            <h3 class="mb-3">Select a Service</h3>

            <div class="d-grid gap-3">
                <button class="btn btn-primary" onclick="selectService('Bonafide')">
                    Bonafide Certificate
                </button>
                <button class="btn btn-secondary" onclick="selectService('Transfer')">
                    Transfer Certificate
                </button>
                <button class="btn btn-success" onclick="selectService('Fee')">
                    Fee Payment
                </button>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Check authentication
        if (!getAuthToken()) {
            window.location.href = "/";
        }

        function selectService(service) {
            localStorage.setItem("selectedService", service);
            window.location.href = "token.html";
        }
    </script>

</body>

</html>
