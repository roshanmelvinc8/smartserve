<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard - Token Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        @media (max-width: 768px) {
            .container {
                padding-left: 15px;
                padding-right: 15px;
            }

            h2 {
                font-size: 1.8rem;
            }

            .card {
                margin-bottom: 10px;
            }

            .row {
                row-gap: 15px;
            }
        }
    </style>
</head>

<body class="bg-light">

    <div class="container py-5">

        <h2 class="text-center mb-4 fw-bold">Staff Dashboard</h2>
        <p class="text-center text-muted mb-5">
            Call Next Token for Each Service
        </p>

        <div class="row g-4">

            <div class="col-md-4 col-sm-6 col-12">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body text-center">
                        <h5 class="fw-bold">Bonafide Certificate</h5>
                        <p class="mt-3">
                            Current Token:
                            <span class="fw-bold text-primary" id="bonafideCurrent">—</span>
                        </p>
                        <button class="btn btn-primary w-100 mt-3" onclick="callNext('Bonafide','B')">
                            Call Next
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 col-sm-6 col-12">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body text-center">
                        <h5 class="fw-bold">Transfer Certificate</h5>
                        <p class="mt-3">
                            Current Token:
                            <span class="fw-bold text-success" id="transferCurrent">—</span>
                        </p>
                        <button class="btn btn-success w-100 mt-3" onclick="callNext('Transfer','T')">
                            Call Next
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 col-sm-6 col-12">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body text-center">
                        <h5 class="fw-bold">Fee Enquiry</h5>
                        <p class="mt-3">
                            Current Token:
                            <span class="fw-bold text-warning" id="feeCurrent">—</span>
                        </p>
                        <button class="btn btn-warning w-100 mt-3" onclick="callNext('Fee','F')">
                            Call Next
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function loadCurrentTokens() {
            document.getElementById("bonafideCurrent").innerText =
                localStorage.getItem("Bonafide_current") || "—";

            document.getElementById("transferCurrent").innerText =
                localStorage.getItem("Transfer_current") || "—";

            document.getElementById("feeCurrent").innerText =
                localStorage.getItem("Fee_current") || "—";
        }

        function callNext(service, prefix) {
                      // token counts are stored as `service + "_token"` in token.html
            const countKey = service + "_token";
            const currentKey = service + "_current";

            const count = parseInt(localStorage.getItem(countKey)) || 0;

            // `current` is stored as e.g. "B-1" — extract the numeric part safely
            const currentStored = localStorage.getItem(currentKey);
            let current = 0;
            if (currentStored) {
                const parts = currentStored.split('-');
                current = parseInt(parts[1]) || 0;
            }

            if (current < count) {
                current++;
                localStorage.setItem(currentKey, prefix + "-" + current);
                loadCurrentTokens();
            } else {
                alert("No more tokens waiting for " + service);
            }
        }

        loadCurrentTokens();
        setInterval(loadCurrentTokens, 2000);
    </script>

</body>
