<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Display - SmartServe</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top, #4f46e5, #0f172a);
            font-family: "Segoe UI", sans-serif;
        }

        .token-card {
            border-radius: 24px;
            background: #ffffff;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
        }

        .token-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            margin: 25px auto;
        }

        .service-label {
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6c757d;
        }

        .wait-text {
            color: #64748b;
            font-size: 1.05rem;
        }
        
        .navbar-custom {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            margin-bottom: 2rem;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 10;
        }
        
        .navbar-custom .btn-logout {
            background-color: #ff6b6b;
            color: white;
            border: none;
        }
        
        .navbar-custom .btn-logout:hover {
            background-color: #ff4757;
            color: white;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .token-circle {
                width: 120px;
                height: 120px;
                font-size: 2rem;
                margin: 20px auto;
            }

            .service-label {
                font-size: 0.85rem;
            }

            .wait-text {
                font-size: 0.95rem;
            }

            .navbar-custom {
                padding: 0.8rem;
            }

            .navbar-custom h4 {
                font-size: 1.2rem !important;
            }

            .token-card {
                margin: 0 15px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar-custom d-flex justify-content-between align-items-center">
        <h4 style="color: white; margin: 0;">SmartServe</h4>
        <button class="btn btn-logout btn-sm" onclick="logout()">Logout</button>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center" style="margin-top: 60px;">
            <div class="col-md-6 col-lg-4">

                <div class="token-card p-4 text-center">

                    <h3 class="fw-bold mb-1">🎫 Your Token</h3>

                    <div class="service-label mt-2" id="serviceName"></div>

                    <div class="token-circle" id="tokenNumber">--</div>

                    <p class="wait-text">Please wait for your turn</p>

                    <a href="next.html" class="btn btn-success w-100 mt-3">
                        Back to Services
                    </a>

                </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Check authentication
        if (!getAuthToken()) {
            window.location.href = "/";
        }

        const service = localStorage.getItem("selectedService");

        if (!service) {
            document.getElementById("serviceName").innerText = "No service selected";
            document.getElementById("tokenNumber").innerText = "Error";
        } else {
            // Call backend API to generate token
            (async function() {
                try {
                    const data = await apiCall("/student/generate-token", "POST", { service });
                    const token = data.token;

                    document.getElementById("serviceName").innerText = `Service: ${service}`;
                    document.getElementById("tokenNumber").innerText = token.token_number;

                    // Store for later reference
                    localStorage.setItem("lastToken", token.token_number);
                } catch (error) {
                    alert(`Error: ${error.message}`);
                    document.getElementById("tokenNumber").innerText = "Error";
                }
            })();
        }
    </script>

</body>

</html>
